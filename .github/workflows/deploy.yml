name: Build and deploy simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Block private lab data
        run: |
          if grep -rEn "10\.1\.6\.17|DG56RP0811|7C:A6:2A:70:C1:6C|ILODG56RP0811|clickhouse-sh12r1" --exclude-dir=.git .; then
            echo "Real device data found - not publishing"; exit 1
          fi

      - name: Build the simulator
        run: node build.js _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4